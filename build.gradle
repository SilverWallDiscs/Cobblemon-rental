plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    exclusiveContent {
        forRepository { maven { url 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.0.21" // Cobblemon Kotlin collection signatures (Java compile)
    modImplementation 'maven.modrinth:MdwFAVRL:kF7CvxTo' // Cobblemon 1.7.3 Fabric
    modLocalRuntime 'maven.modrinth:s7N7AsqL:NQdxKsW7' // Optional CobbleDollars 2.0 Beta 6.1
    modCompileOnly 'maven.modrinth:LdBYVaPS:KwNU9SQW' // Optional Impactor 5.3.5 Fabric 1.21.1 API
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21; withSourcesJar() }
