name: Build Pokemon Rental

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Fabric 1.21.1 / Java 21
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle 8.12.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Build and remap JAR
        run: gradle --no-daemon clean build --stacktrace
      - name: Upload Fabric mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-rental-jar
          path: build/libs/pokemon-rental-*.jar
          if-no-files-found: error
